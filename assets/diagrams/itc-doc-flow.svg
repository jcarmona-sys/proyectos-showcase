<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Flujo funcional ITC-DOC">
  <rect width="1100" height="360" fill="#f7f8fb"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">ITC-DOC - flujo funcional</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526072">Consulta rapida en web manteniendo compatibilidad con la fuente operativa heredada.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(70 145)">
      <rect width="160" height="92" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="80" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Access</text>
      <text x="80" y="64" text-anchor="middle" font-size="13" fill="#526072">Fuente operativa</text>
    </g>
    <g transform="translate(285 145)">
      <rect width="160" height="92" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="80" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Exportacion</text>
      <text x="80" y="64" text-anchor="middle" font-size="13" fill="#526072">Lectura controlada</text>
    </g>
    <g transform="translate(500 145)">
      <rect width="160" height="92" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="80" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">SQLite</text>
      <text x="80" y="64" text-anchor="middle" font-size="13" fill="#526072">Snapshot rapido</text>
    </g>
    <g transform="translate(715 145)">
      <rect width="160" height="92" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="80" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">API Python</text>
      <text x="80" y="64" text-anchor="middle" font-size="13" fill="#526072">Validacion y PDF</text>
    </g>
    <g transform="translate(930 145)">
      <rect width="120" height="92" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="60" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Web</text>
      <text x="60" y="64" text-anchor="middle" font-size="13" fill="#526072">Operacion</text>
    </g>
    <g stroke="#7b8ba6" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M232 191 H280"/>
      <path d="M447 191 H495"/>
      <path d="M662 191 H710"/>
      <path d="M877 191 H925"/>
      <path d="M785 238 C785 295 160 295 160 240"/>
    </g>
    <text x="470" y="322" font-size="14" fill="#526072">Las escrituras regresan por transaccion controlada y luego se resincroniza la vista web.</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8ba6"/>
    </marker>
  </defs>
</svg>
