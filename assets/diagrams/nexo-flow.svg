<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Arquitectura funcional Nexo">
  <rect width="1100" height="360" fill="#f7f8fb"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Nexo - asistencia remota</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526072">Relay autenticado entre agente, API y visor web/desktop.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(70 140)">
      <rect width="190" height="104" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="95" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Agente</text>
      <text x="95" y="66" text-anchor="middle" font-size="13" fill="#526072">Captura pantalla</text>
      <text x="95" y="86" text-anchor="middle" font-size="13" fill="#526072">Frames JPEG</text>
    </g>
    <g transform="translate(455 120)">
      <rect width="210" height="144" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="105" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">FastAPI</text>
      <text x="105" y="72" text-anchor="middle" font-size="13" fill="#526072">JWT y ownership</text>
      <text x="105" y="94" text-anchor="middle" font-size="13" fill="#526072">REST + WebSockets</text>
      <text x="105" y="116" text-anchor="middle" font-size="13" fill="#526072">Dispositivos y sesiones</text>
    </g>
    <g transform="translate(840 140)">
      <rect width="190" height="104" rx="10" fill="#ffffff" stroke="#cfd6e4"/>
      <text x="95" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Visor</text>
      <text x="95" y="66" text-anchor="middle" font-size="13" fill="#526072">Canvas web</text>
      <text x="95" y="86" text-anchor="middle" font-size="13" fill="#526072">Cliente desktop</text>
    </g>
    <g stroke="#7b8ba6" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M262 192 H448"/>
      <path d="M668 192 H835"/>
      <path d="M835 218 H668"/>
      <path d="M448 218 H262"/>
    </g>
    <text x="350" y="176" font-size="13" fill="#526072">Frames</text>
    <text x="728" y="176" font-size="13" fill="#526072">Relay</text>
    <text x="708" y="238" font-size="13" fill="#526072">Comandos</text>
    <text x="330" y="238" font-size="13" fill="#526072">Modo/calidad</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8ba6"/>
    </marker>
  </defs>
</svg>
